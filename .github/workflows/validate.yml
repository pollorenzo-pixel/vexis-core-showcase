name: Validate showcase

on:
  push:
    branches:
      - main
      - feature/employer-facing-code-samples
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: showcase-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            lint.log
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce lint result
        if: steps.lint.outputs.exit_code != '0'
        run: |
          cat lint.log
          exit 1

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
